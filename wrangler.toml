name = "app"
main = "worker.ts"
compatibility_date = "2026-10-02"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[triggers]
crons = [
  "0 * * * *",     # 1. notifications & dynamic user-schedule backups (every hour)
  "0 8 * * *",     # 2. calendar-reminders (08:00 UTC daily)
  "0 22 * * *",    # 3. einvoice-reconcile (22:00 UTC daily)
  "0 4 * * *"      # 4. stock-integrity (04:00 UTC daily)
]

