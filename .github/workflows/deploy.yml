name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      # Non-sensitive build-time public configuration
      NEXT_PUBLIC_SUPABASE_URL: "https://cxekeitxvfkukujselxr.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4ZWtlaXR4dmZrdWt1anNlbHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMjQ1NjYsImV4cCI6MjA5NzYwMDU2Nn0.UkOLvClPdWbk4yYYSLUPQrO3DmXpMHaAQVolhIToErQ"
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAKrXH5Vv-obrIyf75T53KN4RsOfjB6U1M"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:438606426821:web:18d85ed9603b15acc576ac"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "tas-erp-cdcb2.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "438606426821"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "tas-erp-cdcb2"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "tas-erp-cdcb2.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: "BCNwdWkU7Htt4F7ziaCwjsEfuu9OcVo9msEBuTaGGxRhbMXfzCOeKQcB3bJBy0Gn90kIvXqdbhMFoQYFDZ83DAI"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck validation
        run: npm run typecheck

      - name: Build OpenNext Worker Bundle
        run: npm run build:worker

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
